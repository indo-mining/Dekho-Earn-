<section id="uploadPage" class="page-section">

  <div class="section-header">
    <div>
      <h2>Upload Video 🎥</h2>
      <p>Apna video DekhoEarn par share karein</p>
    </div>
  </div>

  <div class="upload-card">

    <label class="upload-label">
      Video Title
    </label>

    <input
      type="text"
      id="videoTitle"
      class="input"
      maxlength="120"
      placeholder="Video ka title"
      autocomplete="off"
    />


    <label class="upload-label">
      Description
    </label>

    <textarea
      id="videoDescription"
      class="input textarea"
      maxlength="1000"
      placeholder="Video ke baare mein likhein..."
    ></textarea>


    <label class="upload-label">
      Video Select Karein
    </label>

    <label
      for="videoFile"
      class="video-picker"
    >

      <div class="video-picker-icon">
        🎥
      </div>

      <div class="video-picker-content">

        <strong id="videoFileName">
          Gallery se video choose karein
        </strong>

        <small>
          MP4, MOV, WebM • Maximum 100 MB
        </small>

      </div>

    </label>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
      hidden
    />


    <!-- VIDEO PREVIEW -->

    <div
      id="uploadPreview"
      class="upload-preview hidden"
    >

      <video
        id="uploadPreviewVideo"
        controls
        playsinline
      ></video>

    </div>


    <!-- PROGRESS -->

    <div
      id="uploadProgressBox"
      class="upload-progress-box hidden"
    >

      <div class="upload-progress-text">

        <span id="uploadProgressText">
          Uploading...
        </span>

        <span id="uploadProgressPercent">
          0%
        </span>

      </div>

      <div class="progress-track">

        <div
          id="uploadProgressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <button
      type="button"
      id="uploadVideoBtn"
      class="primary-btn"
    >
      🎥 Upload Video
    </button>


    <p class="upload-note">
      Video Cloudinary par securely upload hoga.
      Video ki information DekhoEarn ke Neon database
      mein save hogi.
    </p>

  </div>

</section>
